name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install .
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI entry point
        run: |
          claudefm --version
          claudefm --help

  package:
    name: Distribution checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
      - name: Check distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile
          forbidden = {'art', 'docs', 'tests', '.local', '__pycache__', '.venv'}
          wheel = next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert all(not forbidden.intersection(Path(n).parts) for n in names), names
              assert all(Path(n).parts[0] == 'claudefm' or Path(n).parts[0].endswith('.dist-info') for n in names), names
          source = next(Path('dist').glob('*.tar.gz'))
          with tarfile.open(source) as archive:
              names = archive.getnames()
              assert all(not forbidden.intersection(Path(n).parts) for n in names), names
          PY
      - name: Smoke test clean wheel and source installs
        run: |
          python -m venv "$RUNNER_TEMP/claudefm-wheel"
          "$RUNNER_TEMP/claudefm-wheel/bin/python" -m pip install --no-deps dist/*.whl
          python -m venv "$RUNNER_TEMP/claudefm-source"
          "$RUNNER_TEMP/claudefm-source/bin/python" -m pip install --no-deps dist/*.tar.gz
          cd "$RUNNER_TEMP"
          for kind in wheel source; do
            "$RUNNER_TEMP/claudefm-$kind/bin/claudefm" --help
            "$RUNNER_TEMP/claudefm-$kind/bin/claudefm" --version
            "$RUNNER_TEMP/claudefm-$kind/bin/python" -c 'from importlib.metadata import version; import claudefm; assert version("claudefm") == claudefm.__version__'
          done
